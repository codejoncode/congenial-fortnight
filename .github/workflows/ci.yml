name: CI — PR Guard

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test:
    name: Tests & Coverage Gate
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: forex_signal.settings
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django migrations
        run: python manage.py migrate --run-syncdb

      - name: Django system check
        run: python manage.py check --deploy --fail-level WARNING 2>/dev/null || python manage.py check

      - name: Run test suite with coverage
        run: |
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -q \
            --ignore=tests/test_signals.py \
            --ignore=tests/test_all_signals_integration.py \
            --cov=signals \
            --cov=trading \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Backtest profitability gate
        run: |
          python - <<'EOF'
          import sys, os, numpy as np, pandas as pd
          sys.path.insert(0, '.')
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'forex_signal.settings')
          import django; django.setup()
          from trading.backtest import run_backtest
          from unittest.mock import MagicMock

          def make_df(n=1000, seed=42):
              rng = np.random.default_rng(seed)
              close = 1.10 + np.cumsum(rng.normal(0, 0.0005, n))
              spread = rng.uniform(0.0001, 0.0008, n)
              idx = pd.date_range('2022-01-01', periods=n, freq='h')
              return pd.DataFrame({'open': close-0.0001, 'high': close+spread,
                                   'low': close-spread, 'close': close}, index=idx)

          def mock_engine():
              e = MagicMock()
              def pred(pair, hist):
                  ep = float(hist['close'].iloc[-1])
                  atr = float((hist['high']-hist['low']).rolling(14,min_periods=5).mean().iloc[-1])
                  return {'signal': 'bullish', 'probability': 0.63,
                          'stop_loss': ep - 1.5*atr, 'take_profit': ep + 2.5*atr}
              e.predict.side_effect = pred
              return e

          df = make_df()
          result = run_backtest('EURUSD', df, mock_engine(), signal_every=24, max_hold=24)
          if result.error:
              print(f'Backtest error: {result.error}')
              sys.exit(1)
          print(f'Trades={result.n_trades}  PF={result.profit_factor:.3f}  WR={result.win_rate:.1%}  Exp={result.expectancy_pips:+.2f}pips')
          if result.n_trades < 5:
              print('Too few trades generated — skipping gate')
              sys.exit(0)
          if result.profit_factor < 0.5:
              print(f'GATE FAILED: profit factor {result.profit_factor:.3f} < 0.5')
              sys.exit(1)
          print('Profitability gate passed.')
          EOF

  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          CI: false
          REACT_APP_API_BASE_URL: http://localhost:8000

  auto-merge:
    name: Auto-Merge on Pass
    needs: [test, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'

    steps:
      - name: Auto-merge PR
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
